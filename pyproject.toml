[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "squadrone"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Squadrone multi-agent WordPress plugin vulnerability research tool"
dependencies = [
    # 1.100.x routes ChatGPT Responses through a bridge that bypasses the
    # stream-output compatibility adapter in services/llm.py.
    "litellm==1.89.1",
    "httpx==0.28.1",
    "requests==2.34.2",
    "aiosqlite==0.22.1",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "aiodocker==0.27.0",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "playwright==1.62.0",
    "rich==15.0.0",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-httpx==0.36.2",
    "ruff==0.16.7",
    "mypy==2.3.1",
]

[project.scripts]
squadrone = "squadrone.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
squadrone = ["prompts/*.md", "prompts/specialists/*.md", "poc_templates/*.j2", "poc_templates/*.py"]
"squadrone.docker" = ["*.j2", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
