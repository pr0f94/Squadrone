# OpenAI research pipeline.
#
# This uses the ChatGPT-subscription model routing from pipelines/openai.yaml,
# including Squadrone's temporary LiteLLM compatibility patches for newer models,
# and uses a higher budget plus the fixed research-oriented pipeline settings.
#
# Use with:
#   squadrone scan <slug> --budget 10.00 --config pipelines/openai-research.yaml

cost_ceiling_usd: 10.00
max_hypotheses_to_verify: 10
sandbox_timeout_seconds: 120
verify_max_iterations: 7
developer_calls_per_agent: 7

models:
  critic: chatgpt/gpt-5.6-sol
  developer: chatgpt/gpt-5.6-sol
  specialists: chatgpt/gpt-5.6-sol
  surveyor: chatgpt/gpt-5.6-sol
  poc_author: chatgpt/gpt-5.6-sol
  developer_followup: chatgpt/gpt-5.6-sol
  reporter: chatgpt/gpt-5.6-sol
  dedup_fallback: chatgpt/gpt-5.6-sol
  hypothesis_verifier: chatgpt/gpt-5.6-sol

llm:
  reasoning_effort: medium
  verbosity: medium

reasoning:
  critic: medium
  developer: medium
  specialists: medium
  poc_author: medium
  hypothesis_verifier: medium
  developer_followup: medium
  surveyor: medium
  reporter: medium
  dedup_fallback: medium

sandbox:
  wordpress_image: wordpress:latest
  db_image: mariadb:10.11
  wp_admin_user: admin
  wp_admin_pass: password
  wp_admin_email: admin@test.local
  wp_url: http://localhost:8080

vuln_dbs:
  wordfence:
    base_url: https://www.wordfence.com/api/intelligence/v2
  wpscan:
    base_url: https://wpscan.com/api/v3

verify:
  persistent_sandbox: false
  state_introspection_on_failure: true
  headless_browser_timeout_s: 15

report:
  screenshot_capture: false
